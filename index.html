<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SynapseDeck</title>
    <meta
      name="description"
      content="Paste what you are studying, get flashcards worth reviewing, and get drilled on them at the right time. Real spaced repetition, and every number counted from your own review log."
    />

    <!-- Icons. All generated by `npm run brand:assets` from assets/brand/*.svg —
         edit the masters, not these. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Two values, so the browser chrome matches whichever theme is showing. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)" />

    <!-- Social. Paths are relative because the app has no domain yet; when one is
         connected, make og:image and og:url absolute — several scrapers will not
         resolve a relative image against the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SynapseDeck" />
    <meta property="og:title" content="SynapseDeck" />
    <meta
      property="og:description"
      content="Paste what you are studying, get flashcards worth reviewing, and get drilled on them at the right time."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SynapseDeck" />
    <meta
      name="twitter:description"
      content="Paste what you are studying, get flashcards worth reviewing, and get drilled on them at the right time."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      /* Theme, before first paint.
         src/app/theme.tsx applies this class in an effect, which is one frame too
         late: on a near-black ground that gap is a white strobe on every cold load.
         This duplicates the storage key deliberately — a module import here would
         defeat the point. The constant is STORAGE_KEY in src/app/theme.tsx; the two
         must move together. */
      (function () {
        try {
          var stored = localStorage.getItem('synapsedeck.theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* Private mode can throw on localStorage. Light is a fine fallback. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
